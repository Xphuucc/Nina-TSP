name: Check Nina data and company agents
on:
  push:
    branches: [docs/manual-api-data-phases]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm check
      - name: Existing tests
        run: pnpm test
      - name: Static build
        run: pnpm build:static
      - name: Upload reviewable static build
        uses: actions/upload-artifact@v4
        with:
          name: nina-company-agent-demo
          path: dist/public
          if-no-files-found: error
